<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="/css/app.css"><link rel="manifest" href="/manifest.webmanifest"></head><body><div class="wrap"><form class="form" onsubmit="register(event)"><a class="logo" href="/">CrypInvest</a><h2>Create account</h2><label>Name</label><input id="name" class="input" required><label>Email</label><input id="email" class="input" type="email" required><label>Password</label><input id="password" class="input" type="password" minlength="8" required><label>Invite code</label><input id="invite" class="input" required><button class="btn" style="width:100%">Register</button><p class="muted">Already registered? <a href="/login.html">Login</a></p></form></div><div id="toast" class="toast"></div><script src="/js/app.js"></script><script>const q=new URLSearchParams(location.search).get("invite");if(q)document.querySelector("#invite").value=q;</script><script>if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script></body></html>
