<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile</title><link rel="stylesheet" href="/css/app.css"><link rel="manifest" href="/manifest.webmanifest"></head><body><div class="wrap mobile-page"><a class="logo" href="/dashboard.html">← Dashboard</a><form class="form" id="profile"><h2>Profile</h2><label>Name</label><input id="name" class="input" required><label>Email</label><input id="email" class="input" disabled><button class="btn">Save name</button></form><form class="form" id="password"><h2>Change password</h2><label>Current password</label><input id="current" class="input" type="password" required><label>New password</label><input id="new" class="input" type="password" minlength="8" required><button class="btn">Change password</button></form></div><div id="toast" class="toast"></div><script src="/js/app.js"></script><script>(async()=>{try{const d=await api('/user/account');$('#name').value=d.account.name;$('#email').value=d.account.email}catch(e){toast(e.message)}})();$('#profile').onsubmit=async e=>{e.preventDefault();try{await api('/user/profile',{method:'PATCH',body:JSON.stringify({name:$('#name').value})});toast('Profile saved')}catch(e){toast(e.message)}};$('#password').onsubmit=async e=>{e.preventDefault();try{await api('/user/change-password',{method:'POST',body:JSON.stringify({currentPassword:$('#current').value,newPassword:$('#new').value})});toast('Password changed');e.target.reset()}catch(e){toast(e.message)}};</script><script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');</script></body></html>
