<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Withdraw</title><link rel="stylesheet" href="/css/app.css"><link rel="manifest" href="/manifest.webmanifest"></head><body><div class="wrap mobile-page"><a class="logo" href="/dashboard.html">← Dashboard</a><form class="form" id="f"><h2>USDT Withdrawal</h2><label>Amount</label><input id="amount" class="input" required><label>Network</label><select id="network" class="input"><option>TRC20</option><option>ERC20</option><option>BEP20</option></select><label>Destination address</label><input id="destination" class="input" required><button class="btn">Request Withdrawal</button><p class="muted">The amount is reserved immediately and cannot be reused by another pending withdrawal.</p></form></div><div id="toast" class="toast"></div><script src="/js/app.js"></script><script>$('#f').onsubmit=async e=>{e.preventDefault();try{await api('/withdrawals',{method:'POST',body:JSON.stringify({amount:$('#amount').value,network:$('#network').value,destination:$('#destination').value})});toast('Withdrawal requested');setTimeout(()=>location.href='/dashboard.html',1000)}catch(x){toast(x.message)}};</script><script>if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script></body></html>
