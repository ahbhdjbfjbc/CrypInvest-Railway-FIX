<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deposit</title><link rel="stylesheet" href="/css/app.css"><link rel="manifest" href="/manifest.webmanifest"></head><body><div class="wrap mobile-page"><a class="logo" href="/dashboard.html">← Dashboard</a><form class="form" id="f"><h2>USDT Deposit</h2><div id="walletBox" class="card muted">Loading receiving wallet…</div><label>Amount</label><input id="amount" class="input" required placeholder="100"><label>Network</label><select id="network" class="input"><option>TRC20</option><option>ERC20</option><option>BEP20</option></select><label>Transaction hash</label><input id="txHash" class="input" required placeholder="Paste TX hash"><button class="btn">Submit Deposit</button><p class="muted">Your balance is credited only after verification and admin approval.</p></form></div><div id="toast" class="toast"></div><script src="/js/app.js"></script><script>(async()=>{try{const d=await api('/payment-wallet/available');const w=d.wallets.find(x=>x.currency==='USDT'&&x.network===$('#network').value);if(w)$('#walletBox').innerHTML=`Send only USDT via <b>${esc(w.network)}</b><br><code>${esc(w.address)}</code>`}catch(e){$('#walletBox').textContent='Receiving wallet is not configured yet.'}})();$('#network').onchange=async()=>{try{const d=await api('/payment-wallet?currency=USDT&network='+encodeURIComponent($('#network').value));$('#walletBox').innerHTML=`Send only USDT via <b>${esc(d.wallet.network)}</b><br><code>${esc(d.wallet.address)}</code>`}catch(e){$('#walletBox').textContent='Receiving wallet is not configured for this network.'}};$('#f').onsubmit=async e=>{e.preventDefault();try{const d=await api('/deposits',{method:'POST',body:JSON.stringify({amount:$('#amount').value,network:$('#network').value,txHash:$('#txHash').value})});toast('Deposit submitted');setTimeout(()=>location.href='/dashboard.html',1000)}catch(x){toast(x.message)}};</script><script>if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script></body></html>
