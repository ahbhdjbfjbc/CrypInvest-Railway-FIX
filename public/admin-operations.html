<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Operations</title><link rel="stylesheet" href="/css/app.css"><link rel="manifest" href="/manifest.webmanifest"></head><body><div class="dash"><aside class="side"><div class="logo">CrypInvest Admin</div><a href="/admin.html">Dashboard</a><a class="active" href="/admin-operations.html">Operations</a><a href="/">Public site</a></aside><main class="main"><h1>Operations</h1><div class="cards"><div class="card"><h3>Pending deposits</h3><div id="deps"></div></div><div class="card"><h3>Pending withdrawals</h3><div id="withs"></div></div></div><section class="section"><h2 style="text-align:left">Users</h2><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Balance</th><th>Status</th></tr></thead><tbody id="users"></tbody></table></section></main></div><div id="toast" class="toast"></div><script src="/js/app.js"></script><script>(async()=>{try{const d=await api('/admin/deposits?status=pending');document.querySelector('#deps').innerHTML=d.items.map(x=>`<p>${esc(x.user?.email||'')} • $${esc(x.amount)} <button class="btn" onclick="verifyDeposit('${x._id}')">Verify</button></p>`).join('')||'<p class="muted">None</p>';const w=await api('/admin/withdrawals?status=pending');document.querySelector('#withs').innerHTML=w.items.map(x=>`<p>${esc(x.user?.email||'')} • $${esc(x.amount)} ${esc(x.network)}</p>`).join('')||'<p class="muted">None</p>';const u=await api('/admin/users');document.querySelector('#users').innerHTML=u.items.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.email)}</td><td>$${esc(x.availableBalance)}</td><td>${esc(x.status)}</td></tr>`).join('')}catch(e){toast(e.message)}})();async function verifyDeposit(id){try{const v=await api('/admin/deposits/'+id+'/verify',{method:'POST'});if(v.verification.verified){await api('/admin/deposits/'+id+'/approve',{method:'POST'});toast('Deposit verified and approved')}else toast(v.verification.reason);location.reload()}catch(e){toast(e.message)}}</script><script>if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script></body></html>
