<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Referrals</title><link rel="stylesheet" href="/css/app.css"><link rel="manifest" href="/manifest.webmanifest"></head><body><div class="wrap" style="padding-top:40px"><a class="logo" href="/dashboard.html">CrypInvest</a><div class="card" style="margin-top:25px"><h2>Your referral code</h2><div id="code" class="price">Loading...</div><p class="muted">Share this code only with people who understand the platform and its risks.</p></div><section class="section"><div class="card"><h3>Invite link</h3><div id="inviteLink" class="muted"></div><button class="btn" onclick="copyInvite()">Copy invite link</button></div></section><section class="section"><h2 style="text-align:left">Direct referrals</h2><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Joined</th></tr></thead><tbody id="rows"></tbody></table></section></div><script src="/js/app.js"></script><script>(async()=>{try{const c=await api('/user/referral-code');document.querySelector('#code').textContent=c.referralCode;document.querySelector('#inviteLink').textContent=location.origin+'/register.html?invite='+encodeURIComponent(c.referralCode);const r=await api('/user/referrals');document.querySelector('#rows').innerHTML=r.items.map(x=>`<tr><td>${esc(x.referredUser.name)}</td><td>${esc(x.referredUser.email)}</td><td>${esc(x.referredUser.status)}</td><td>${new Date(x.referredUser.createdAt).toLocaleDateString()}</td></tr>`).join('')||'<tr><td colspan="4">No referrals yet.</td></tr>'}catch(e){toast(e.message)}})();window.copyInvite=async()=>{try{await navigator.clipboard.writeText(document.querySelector("#inviteLink").textContent);toast("Invite link copied")}catch(e){toast("Copy failed")}};</script><div id="toast" class="toast"></div><script>if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script></body></html>
