<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>CrypInvest | دخول الإدارة</title><link rel="stylesheet" href="/admin-assets/admin.css"></head><body><main class="adminLogin"><form id="adminLoginForm" class="panel"><div class="brand"><span class="brandMark">₿</span><b style="color:#ffb31b">CrypInvest</b></div><h1>دخول لوحة الإدارة</h1><p class="hint">هذه الصفحة منفصلة عن دخول المستخدمين. جميع أدوار الإدارة تتطلب 2FA.</p><label>البريد الإلكتروني<input id="email" class="input" type="email" autocomplete="username" required></label><label>كلمة المرور<input id="password" class="input" type="password" autocomplete="current-password" required></label><label>رمز 2FA<input id="twoFactorCode" class="input" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required></label><button class="btn" type="submit">دخول الإدارة</button><p id="msg" class="hint"></p></form></main><script src="/admin-login-assets/login.js" defer></script></body></html>
